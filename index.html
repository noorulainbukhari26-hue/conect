<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conect Pk | Digital Card</title>
<style>:root{--bg:#e8eef2;--card:#fff;--ink:#14213d;--muted:#5a6679;--accent:#14213d;--ai:#fff;--line:#d5dde5}
@media(prefers-color-scheme:dark){:root{--bg:#0d1526;--card:#16213a;--ink:#f1f4f9;--muted:#9aa7bd;--accent:#fca311;--ai:#14213d;--line:#27345a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:440px}header{text-align:center;padding:28px 8px 22px}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;background:var(--accent);color:var(--ai);display:grid;place-items:center;font-size:36px;font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}h1{margin:0;font-size:26px;font-weight:800}
.role{margin:4px 0 0;color:var(--muted);font-weight:600}.bio{margin:12px auto 0;max-width:34ch;color:var(--muted);line-height:1.55}
.primary{display:block;width:100%;text-align:center;border:0;font:inherit;font-weight:800;padding:16px;border-radius:14px;background:var(--accent);color:var(--ai);margin-bottom:18px;cursor:pointer}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.link{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:60px}
.link:hover{border-color:var(--ink)}.badge{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.label{font-weight:700}.sub{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
a:focus-visible,button:focus-visible{outline:3px solid #fca311;outline-offset:2px}</style></head>
<body><main><header><div class="avatar" id="avatar"></div><h1 id="name"></h1><p class="role" id="role"></p><p class="bio" id="bio"></p></header>
